name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (results/ and worklog/ are excluded via pyproject extend-exclude).
        run: ruff check .

  secret-scan:
    name: detect-secrets (no new findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install detect-secrets
        run: pip install "detect-secrets==1.5.0"
      - name: Ensure baseline exists
        run: test -f .secrets.baseline
      - name: Scan and fail on new potential secrets
        run: |
          detect-secrets scan --all-files --exclude-files '(^|[\\/])\.venv([\\/]|$)' > .secrets.ci.baseline
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          def load(path: str) -> dict:
              raw = Path(path).read_text(encoding="utf-8")
              return json.loads(raw)

          def flatten(data: dict) -> set[tuple[str, str, int | None, str]]:
              out = set()
              for filename, findings in data.get("results", {}).items():
                  for finding in findings:
                      out.add(
                          (
                              filename,
                              str(finding.get("type", "")),
                              finding.get("line_number"),
                              str(finding.get("hashed_secret", "")),
                          )
                      )
              return out

          baseline = flatten(load(".secrets.baseline"))
          current = flatten(load(".secrets.ci.baseline"))
          added = sorted(current - baseline)

          if added:
              print("New potential secrets detected (not in baseline):")
              for filename, ftype, line_no, hashed in added:
                  print(f"- {filename}:{line_no} | {ftype} | {hashed}")
              sys.exit(1)

          print("No new secret findings relative to baseline.")
          PY

